name: Deploy Vite to GitHub Pages

on:
  push:
    branches:
      - main  # Change this to your default branch if needed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the Vite project
      - name: Build project
        env:
          VITE_GI_CLIENT_SECRET: ${{ secrets.VITE_GI_CLIENT_SECRET }}
          VITE_GI_REFRESH_TOKEN: ${{ secrets.VITE_GI_REFRESH_TOKEN }}
          VITE_HQ_CLIENT_SECRET: ${{ secrets.VITE_HQ_CLIENT_SECRET }}
          VITE_HQ_REFRESH_TOKEN: ${{ secrets.VITE_HQ_REFRESH_TOKEN }}  # Inject the secret
        run: npm run build

      # Step 5: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist  # Vite's default output directory
